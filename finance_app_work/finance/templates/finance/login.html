{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finio — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'finance/css/style.css' %}"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <span class="logo-text">Finio</span>
    </div>

    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Sign in to your financial dashboard</div>

    {% if form.errors %}
    <div class="message message-error" style="margin-bottom: 16px">
      Invalid username or password. Please try again.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}"/>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="your_username" autofocus required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{% url 'signup' %}">Create one</a>
    </div>

    <div style="margin-top: 20px; padding: 12px; background: rgba(124,58,237,0.08); border-radius: 8px; border: 1px solid rgba(124,58,237,0.15);">
      <div style="font-size: 11px; color: #7c3aed; font-weight: 600; margin-bottom: 4px;">Sandbox Demo</div>
      <div style="font-size: 11px; color: #94a3b8;">After login, connect bank with:<br/><span style="color: #e2e8f0">user_good / pass_good</span></div>
    </div>
  </div>
</div>
</body>
</html>
